<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a18">
<meta name="description" content="Bảo vệ HN cùng đại ca Vũ Tuấn Anh - game bắn súng góc nhìn thứ nhất chạy trên trình duyệt, bối cảnh Phố Cổ Hà Nội.">
<title>Bảo vệ HN cùng đại ca Vũ Tuấn Anh</title>
<style>
:root{--gold:#ffd76a;--gold2:#c8871f;--red:#b3262a;--ink:#0b0a18;--panel:rgba(14,10,26,.88);--txt:#f3ead7;--mut:#b5a991;--green:#3f8a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#app,#view{position:fixed;inset:0}
#view canvas{display:block;width:100%!important;height:100%!important}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.screen.show{display:flex}
.logo svg{width:100%;height:100%;display:block}
.logo{width:72px;height:72px;flex:none;filter:drop-shadow(0 4px 14px rgba(255,190,80,.35))}
.logo.big{width:140px;height:140px;margin:0 auto}

/* splash */
#splash{background:radial-gradient(ellipse at 50% 40%,#2a1033 0%,#0b0a18 70%);cursor:pointer;z-index:40}
.splash-inner{text-align:center;animation:fadeUp 1.4s ease both}
.presents{margin-top:18px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);font-size:13px}
.splash-title{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(40px,9vw,84px);color:var(--gold);letter-spacing:.06em;text-shadow:0 0 30px rgba(255,170,60,.45),0 4px 0 #6b1414;margin-top:6px}
.splash-sub{font-size:clamp(16px,3.4vw,26px);color:#fff;margin-top:2px}
.splash-credit{margin-top:22px;font-size:14px;color:var(--mut)}
.splash-credit b{color:var(--gold)}
.tap{margin-top:34px;font-size:15px;letter-spacing:.15em;text-transform:uppercase}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* menu */
#menu{justify-content:flex-start;background:linear-gradient(90deg,rgba(8,6,18,.92) 0%,rgba(8,6,18,.55) 45%,rgba(8,6,18,0) 75%)}
.menu-col{max-width:440px;width:100%;padding-left:clamp(0px,4vw,60px)}
.title-block{display:flex;gap:16px;align-items:center;margin-bottom:26px}
h1{white-space:nowrap;font-family:Georgia,"Times New Roman",serif;margin:0;font-size:clamp(36px,6vw,58px);line-height:1;color:var(--gold);letter-spacing:.04em;text-shadow:0 3px 0 #6b1414,0 0 24px rgba(255,170,60,.35)}
h2{margin:6px 0 0;font-weight:500;font-size:clamp(15px,2.4vw,20px);color:#fff}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.row{flex-direction:row;justify-content:center;margin-top:16px}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,215,106,.25);padding:13px 20px;border-radius:10px;text-align:left;font-size:17px;transition:background .15s,transform .15s,border-color .15s}
.btn:hover,.btn:focus-visible{background:rgba(255,215,106,.14);border-color:var(--gold);transform:translateX(3px);outline:none}
.btn.primary{background:linear-gradient(180deg,#c9372f,#8e1b1b);border-color:#ff8a5c;font-weight:700}
.btn.primary:hover{background:linear-gradient(180deg,#dd4438,#a3231f)}
.btn.small{padding:10px 18px;font-size:15px;text-align:center;margin-top:16px}
.lang{display:flex;gap:6px;margin-top:22px}
.lang button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--mut)}
.lang button.on{border-color:var(--gold);color:var(--gold)}
.foot{margin-top:18px;font-size:12px;color:var(--mut)}

.panel{background:var(--panel);border:1px solid rgba(255,215,106,.25);border-radius:14px;padding:22px 24px;max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center;backdrop-filter:blur(6px)}
.panel.wide{max-width:860px}
.panel h3{margin:0 0 16px;font-family:Georgia,serif;color:var(--gold);font-size:26px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.card b{font-size:18px;color:var(--gold)}
.card span{font-size:13px;color:var(--mut)}
.card:hover,.card:focus-visible{border-color:var(--gold);background:rgba(255,215,106,.1);outline:none}
.story{margin-top:16px;font-size:14px;line-height:1.55;color:var(--txt);text-align:left;background:rgba(0,0,0,.25);padding:12px 14px;border-radius:10px}
.rows{display:flex;flex-direction:column;gap:10px;text-align:left}
.rows label{display:grid;grid-template-columns:1fr 1.3fr 48px;align-items:center;gap:10px;font-size:15px}
.rows select{grid-column:2/4;background:#1d1830;color:var(--txt);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px}
.rows input[type=range]{width:100%;accent-color:var(--gold)}
.rows input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.rows em{font-style:normal;color:var(--mut);font-size:13px;text-align:right}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;text-align:left}
.howgrid div{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 14px}
.howgrid h4{margin:4px 0 6px;color:var(--gold)}
.howgrid p{margin:0;font-size:14px;line-height:1.55;white-space:pre-line;color:var(--txt)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.tabs button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:6px 14px}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--mut);font-weight:500;text-align:left}
td:first-child,th:first-child{width:32px;text-align:center;color:var(--gold)}
.note{margin-top:10px;font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;font-size:15px;margin-bottom:14px}
.stats b{color:var(--gold);text-align:right}
#saveRow{display:flex;gap:8px;justify-content:center;align-items:center}
#saveRow .btn{margin:0}
#nameIn{background:#1d1830;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:10px;color:var(--txt);font:inherit;width:180px}
#over h3{font-size:34px}
#pause,#diff,#settings,#howto,#leader,#over{background:rgba(5,4,12,.55)}

/* credits */
#credits{background:#07060f;overflow:hidden;align-items:flex-start;z-index:30}
.roll{position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 34s linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 100vh))}}
.ct{font-family:Georgia,serif;font-size:56px;color:var(--gold);margin-top:16px}
.cs{font-size:20px;color:#fff;margin-top:4px}
.cr{margin-top:26px;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}
.cn{font-size:24px;margin-top:6px;color:#fff}
.cn small{font-size:15px;color:var(--mut)}
.gap{height:60px}
.skip{position:fixed;right:18px;bottom:18px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-variant-numeric:tabular-nums}
#cross{position:absolute;left:50%;top:50%;width:0;height:0;transition:opacity .15s}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross i:nth-child(1),#cross i:nth-child(2){width:2px;height:8px;left:-1px}
#cross i:nth-child(3),#cross i:nth-child(4){height:2px;width:8px;top:-1px}
#cross i:nth-child(1){top:calc(-8px - var(--g,6px))}#cross i:nth-child(2){top:var(--g,6px)}
#cross i:nth-child(3){left:calc(-8px - var(--g,6px))}#cross i:nth-child(4){left:var(--g,6px)}
#hitmark{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;background:
linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%);
-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#hitmark.kill{background:linear-gradient(45deg,transparent 42%,#ff5a3c 42%,#ff5a3c 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#ff5a3c 42%,#ff5a3c 58%,transparent 58%)}
#topleft{position:absolute;left:calc(16px + env(safe-area-inset-left));top:14px;max-width:46vw}
#objective{font-size:17px;font-weight:700;color:var(--gold);text-shadow:0 2px 4px #000}
#objsub{font-size:14px;margin-top:3px;text-shadow:0 2px 4px #000}
#topright{position:absolute;right:calc(14px + env(safe-area-inset-right));top:12px;text-align:right}
#minimap{width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,215,106,.5);background:rgba(0,0,0,.4)}
#scoreline{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-top:4px;text-shadow:0 2px 3px #000}
#score{color:var(--gold);font-weight:700}
#bossbar,#portalbar{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(520px,52vw);text-align:center}
#portalbar{top:64px;width:min(300px,40vw)}
.bn{font-family:Georgia,serif;font-size:16px;color:#e9c8ff;text-shadow:0 2px 4px #000;letter-spacing:.08em}
.bb{height:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:4px}
#bossfill,#portalfill{height:100%;width:100%;background:linear-gradient(90deg,#8a2be2,#ff4fa3);transition:width .1s}
#bottomleft{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:18px}
.hpwrap{display:flex;align-items:center;gap:8px}
.hplabel{font-weight:800;color:var(--gold);font-size:14px}
.hpbar{width:min(240px,34vw);height:14px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#3fbf5a,#9be36b);transition:width .15s}
#hpfill.low{background:linear-gradient(90deg,#d9302c,#ff7a4d)}
#hpnum{font-weight:800;font-size:20px;min-width:40px;text-shadow:0 2px 3px #000}
#buff{margin-bottom:6px;font-size:13px;color:#b7f5a5;text-shadow:0 2px 3px #000}
#bottomright{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:18px;text-align:right}
#ammo{font-size:38px;font-weight:800;line-height:1;text-shadow:0 2px 4px #000}
#ammoRes{font-size:18px;color:var(--mut);margin-left:6px}
#wepname{font-size:14px;color:var(--gold);margin-top:2px}
#weplist{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}
#weplist span{font-size:11px;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);color:var(--mut)}
#weplist span.on{border-color:var(--gold);color:var(--gold)}
#reloadhint{font-size:13px;color:#ff9b7a;margin-top:4px}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#banner .b1{font-family:Georgia,serif;font-size:clamp(26px,5vw,48px);font-weight:900;color:var(--gold);text-shadow:0 3px 0 #6b1414,0 0 24px rgba(0,0,0,.8)}
#banner .b2{font-size:clamp(14px,2.4vw,19px);margin-top:6px;text-shadow:0 2px 4px #000}
#toasts{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.toast{font-size:15px;padding:5px 12px;border-radius:16px;background:rgba(0,0,0,.55);animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#waypoint{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;opacity:.95}
.wp-icon{width:16px;height:16px;margin:0 auto;border:2px solid var(--gold);transform:rotate(45deg);background:rgba(255,215,106,.25);box-shadow:0 0 8px rgba(255,200,80,.8)}
.wp-dist{font-size:12px;margin-top:4px;color:var(--gold);text-shadow:0 1px 3px #000}
.dmgdir{position:absolute;opacity:0;transition:opacity .3s}
.dmgdir.l{left:0;top:20%;bottom:20%;width:14%;background:radial-gradient(ellipse at 0 50%,rgba(255,30,20,.7),transparent 70%)}
.dmgdir.r{right:0;top:20%;bottom:20%;width:14%;background:radial-gradient(ellipse at 100% 50%,rgba(255,30,20,.7),transparent 70%)}
.dmgdir.t{top:0;left:25%;right:25%;height:14%;background:radial-gradient(ellipse at 50% 0,rgba(255,30,20,.7),transparent 70%)}
.dmgdir.b{bottom:0;left:25%;right:25%;height:14%;background:radial-gradient(ellipse at 50% 100%,rgba(255,30,20,.7),transparent 70%)}
#fps{position:absolute;left:8px;bottom:4px;font-size:11px;color:#9f9}
#lockhint{position:absolute;left:50%;top:60%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:10px 18px;border-radius:20px;font-size:15px}

/* touch */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#touch>*{pointer-events:auto}
#tLook{position:absolute;right:0;top:0;bottom:0;width:60%}
#tStick{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2)}
#tKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,215,106,.35);border:2px solid rgba(255,215,106,.7)}
.tb{position:absolute;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.35);font-size:12px;font-weight:700;color:#fff;padding:0;touch-action:none}
.tb.on{background:rgba(255,215,106,.35);border-color:var(--gold)}
#tFire{right:calc(28px + env(safe-area-inset-right));bottom:46px;width:92px;height:92px;background:rgba(180,30,30,.45);border-color:#ff8a5c;font-size:14px}
#tAim{right:calc(136px + env(safe-area-inset-right));bottom:30px;width:62px;height:62px}
#tJump{right:calc(128px + env(safe-area-inset-right));bottom:108px;width:58px;height:58px}
#tReload{right:calc(40px + env(safe-area-inset-right));bottom:156px;width:56px;height:56px}
#tSwap{right:calc(106px + env(safe-area-inset-right));bottom:180px;width:56px;height:56px}
#tPause{left:50%;top:10px;transform:translateX(-50%);width:42px;height:42px;font-size:14px}
body.touch #bottomright{bottom:auto;top:12px;right:calc(130px + env(safe-area-inset-right))}
body.touch #weplist,body.touch #reloadhint{display:none!important}
body.touch #ammo{font-size:28px}
body.touch #bottomleft{bottom:auto;top:84px}
body.touch #minimap{width:104px;height:104px}
body.touch #objective{font-size:15px}body.touch #objsub{font-size:12px}
body.touch #cross{--g:5px}
#rotate{position:fixed;inset:0;z-index:50;background:rgba(5,4,12,.94);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px}
@media (max-width:640px){.cards{grid-template-columns:1fr}.rows label{grid-template-columns:1fr 1.2fr 42px}}
@media (max-height:500px){.logo.big{width:84px;height:84px}.splash-title{font-size:44px}.presents{margin-top:8px}.splash-credit{margin-top:10px}.tap{margin-top:14px}.ct{font-size:40px}#banner .b1{font-size:28px}.title-block{margin-bottom:12px}.logo{width:56px;height:56px}.btn{padding:9px 16px;font-size:15px}.btns{gap:6px}.lang{margin-top:10px}.foot{margin-top:8px}.panel{padding:14px 16px}}

</style>
</head>
<body>
<div id="app">
  <div id="view"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="dmgL" class="dmgdir l"></div><div id="dmgR" class="dmgdir r"></div>
    <div id="dmgT" class="dmgdir t"></div><div id="dmgB" class="dmgdir b"></div>
    <div id="cross"><i></i><i></i><i></i><i></i></div>
    <div id="hitmark"></div>
    <div id="waypoint"><div class="wp-icon"></div><div class="wp-dist">0m</div></div>
    <div id="topleft">
      <div id="objective"></div>
      <div id="objsub"></div>
    </div>
    <div id="topright">
      <canvas id="minimap" width="160" height="160"></canvas>
      <div id="scoreline"><span id="score">0</span><span id="timer">0:00</span></div>
    </div>
    <div id="bossbar" class="hidden"><div class="bn" data-i18n="bossName"></div><div class="bb"><div id="bossfill"></div></div></div>
    <div id="portalbar" class="hidden"><div class="bn" data-i18n="portal"></div><div class="bb"><div id="portalfill"></div></div></div>
    <div id="bottomleft">
      <div id="buff" class="hidden"></div>
      <div class="hpwrap"><div class="hplabel">HP</div><div class="hpbar"><div id="hpfill"></div></div><div id="hpnum">100</div></div>
    </div>
    <div id="bottomright">
      <div id="weplist"></div>
      <div id="ammo"><span id="ammoMag">12</span><span id="ammoRes">/ ∞</span></div>
      <div id="wepname"></div>
      <div id="reloadhint" class="hidden" data-i18n="reloadHint"></div>
    </div>
    <div id="banner"><div class="b1"></div><div class="b2"></div></div>
    <div id="toasts"></div>
    <div id="fps" class="hidden"></div>
    <div id="lockhint" class="hidden" data-i18n="clickToLock"></div>
  </div>

  <!-- touch controls -->
  <div id="touch" class="hidden">
    <div id="tLook"></div>
    <div id="tStick"><div id="tKnob"></div></div>
    <button class="tb" id="tFire" data-i18n="tFire"></button>
    <button class="tb" id="tAim" data-i18n="tAim"></button>
    <button class="tb" id="tJump" data-i18n="tJump"></button>
    <button class="tb" id="tReload" data-i18n="tReload"></button>
    <button class="tb" id="tSwap" data-i18n="tSwap"></button>
    <button class="tb" id="tPause">II</button>
  </div>

  <!-- splash -->
  <div id="splash" class="screen show">
    <div class="splash-inner">
      <div class="logo big"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VTA 2026"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#c8871f"/></linearGradient><radialGradient id="lg2" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#3a1240"/><stop offset="1" stop-color="#120818"/></radialGradient></defs><circle cx="100" cy="100" r="96" fill="url(#lg1)"/><circle cx="100" cy="100" r="86" fill="#8e1b1b"/><circle cx="100" cy="100" r="78" fill="url(#lg2)" stroke="#ffd76a" stroke-width="2"/><circle cx="100" cy="62" r="20" fill="#ffe9a8" opacity=".95"/><g fill="url(#lg1)"><path d="M52 92 L100 74 L148 92 L140 96 L60 96 Z"/><rect x="68" y="96" width="64" height="16"/><path d="M60 114 L100 100 L140 114 L134 118 L66 118 Z"/><rect x="74" y="118" width="12" height="30"/><rect x="114" y="118" width="12" height="30"/><rect x="62" y="146" width="76" height="6"/></g><circle cx="100" cy="104" r="5" fill="#8e1b1b"/><text x="100" y="178" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#ffd76a" letter-spacing="4">VTA</text><text x="100" y="40" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="13" fill="#ffd76a" letter-spacing="3">2026</text></svg></div>
      <div class="presents" data-i18n="presents"></div>
      <div class="splash-title">BẢO VỆ HN</div>
      <div class="splash-sub" data-i18n="titleSub"></div>
      <div class="splash-credit"><span data-i18n="madeBy"></span> · 2026 · <span data-i18n="contact"></span>: <b class="phone"></b></div>
      <div class="tap blink" data-i18n="tapToStart"></div>
    </div>
  </div>

  <!-- main menu -->
  <div id="menu" class="screen">
    <div class="menu-col">

/* ===== grid queries ===== */
// distance along a ray to the first building (DDA over the 4 m grid)
function rayWall(ox, oz, dx, dz, maxD) {
  const len = Math.hypot(dx, dz); if (len < 1e-6) return maxD; dx /= len; dz /= len;
  let c = cellOf(ox), r = cellOf(oz);
  if (blockedCell(r, c)) return 0;
  const stepC = dx > 0 ? 1 : -1, stepR = dz > 0 ? 1 : -1;
  const tdx = Math.abs(CELL / dx), tdz = Math.abs(CELL / dz);
  let tmx = dx !== 0 ? (((dx > 0 ? c + 1 : c) * CELL - HALF) - ox) / dx : Infinity;
  let tmz = dz !== 0 ? (((dz > 0 ? r + 1 : r) * CELL - HALF) - oz) / dz : Infinity;
  let t = 0;
  while (t < maxD) {
    if (tmx < tmz) { t = tmx; tmx += tdx; c += stepC; } else { t = tmz; tmz += tdz; r += stepR; }
    if (blockedCell(r, c)) return t / len * len;
  }
  return maxD;
}
// horizontal distance before a 3D ray hits a wall, converted to 3D length
function rayWall3(o, d, maxD) {
  const hl = Math.hypot(d.x, d.z); if (hl < 1e-4) return maxD;
  const th = rayWall(o.x, o.z, d.x, d.z, maxD * hl);
  return th / hl;
}
function losClear(ax, az, bx, bz) { const d = Math.hypot(bx - ax, bz - az); return rayWall(ax, az, bx - ax, bz - az, d) >= d - 0.01; }
// push a circle out of buildings and round obstacles
function collide(p, rad) {
  const c0 = cellOf(p.x), r0 = cellOf(p.z);
  for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
    if (!blockedCell(r, c)) continue;
    const x0 = (c * CELL) - HALF, z0 = (r * CELL) - HALF;
    const qx = clamp(p.x, x0, x0 + CELL), qz = clamp(p.z, z0, z0 + CELL);
    const dx = p.x - qx, dz = p.z - qz, d2 = dx * dx + dz * dz;
    if (d2 < rad * rad) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (rad - d) / d; p.x += dx * k; p.z += dz * k; }
      else { // centre inside the box: push out the shortest way
        const l = p.x - x0, rr = x0 + CELL - p.x, t = p.z - z0, b = z0 + CELL - p.z, m = Math.min(l, rr, t, b);
        if (m === l) p.x = x0 - rad; else if (m === rr) p.x = x0 + CELL + rad; else if (m === t) p.z = z0 - rad; else p.z = z0 + CELL + rad;
      }
    }
  }
  for (const o of circles) { const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + rad; if (d < m && d > 1e-6) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; } }
  p.x = clamp(p.x, -HALF + 8 + rad, HALF - 8 - rad); p.z = clamp(p.z, -HALF + 8 + rad, HALF - 8 - rad);
}

/* ===== flow field toward the player ===== */
const flow = new Float32Array(NG * NG);
const flowQ = new Int32Array(NG * NG);
let flowCell = -1;
function updateFlow(px, pz, force) {
  const c = clamp(Math.floor((px + HALF) / NC), 0, NG - 1), r = clamp(Math.floor((pz + HALF) / NC), 0, NG - 1), start = r * NG + c;
  if (start === flowCell && !force) return; flowCell = start;
  flow.fill(1e9); flow[start] = 0; let h = 0, t = 0; flowQ[t++] = start;
  while (h < t) {
    const i = flowQ[h++], ir = (i / NG) | 0, ic = i % NG, d = flow[i] + 1;
    if (ic > 0) { const j = i - 1; if (!navBlocked[j] && flow[j] > d) { flow[j] = d; flowQ[t++] = j; } }
    if (ic < NG - 1) { const j = i + 1; if (!navBlocked[j] && flow[j] > d) { flow[j] = d; flowQ[t++] = j; } }
    if (ir > 0) { const j = i - NG; if (!navBlocked[j] && flow[j] > d) { flow[j] = d; flowQ[t++] = j; } }
    if (ir < NG - 1) { const j = i + NG; if (!navBlocked[j] && flow[j] > d) { flow[j] = d; flowQ[t++] = j; } }
  }
}
// returns a unit direction (written into out) that follows the field
function flowDir(x, z, out) {
  const c = clamp(Math.floor((x + HALF) / NC), 0, NG - 1), r = clamp(Math.floor((z + HALF) / NC), 0, NG - 1);
  let best = flow[r * NG + c], br = r, bc = c;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr < 0 || cc < 0 || rr >= NG || cc >= NG) continue;
    if (dr && dc && (navBlocked[r * NG + cc] || navBlocked[rr * NG + c])) continue;
    const v = flow[rr * NG + cc] + (dr && dc ? 0.4 : 0); if (v < best) { best = v; br = rr; bc = cc; }
  }
  const tx = (bc + 0.5) * NC - HALF, tz = (br + 0.5) * NC - HALF; let dx = tx - x, dz = tz - z; const l = Math.hypot(dx, dz) || 1;
  out.x = dx / l; out.z = dz / l; return best;
}

  const m = new THREE.Mesh(SHOT_GEO, new THREE.MeshBasicMaterial({ color: new THREE.Color(col[0], col[1], col[2]) }));
  m.scale.setScalar(r); m.position.copy(o); S.scene.add(m);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: new THREE.Color(col[0] * 0.6, col[1] * 0.6, col[2] * 0.6), blending: THREE.AdditiveBlending, depthWrite: false }));
  sp.scale.set(r * 7, r * 7, 1); m.add(sp); sp.scale.divideScalar(r);
  S.eshots.push({ m, pos: o.clone(), vel: dir.clone().multiplyScalar(speed), dmg, r, col, life: 6 });
}
function updateShots(dt) {
  const P = S.player.pos;
  for (let i = S.eshots.length - 1; i >= 0; i--) {
    const s = S.eshots[i]; s.life -= dt; s.pos.addScaledVector(s.vel, dt); s.m.position.copy(s.pos);
    if (Math.random() < 0.7) FX.emit(s.pos.x, s.pos.y, s.pos.z, rand(-0.3, 0.3), rand(-0.3, 0.3), rand(-0.3, 0.3), 0.35, s.r * 2.2, 0.05, s.col[0], s.col[1], s.col[2]);
    const dy = s.pos.y - (P.y - 0.6), hit = Math.hypot(s.pos.x - P.x, dy * 0.6, s.pos.z - P.z) < s.r + 0.5;
    let done = s.life <= 0 || s.pos.y < 0.05 || blockedAt(s.pos.x, s.pos.z);
    if (hit) { S.player.damage(s.dmg, s.pos); done = true; }
    if (done) { FX.burst(s.pos, 12, 4, 0.4, 0.3, 0.05, s.col, 2, 3); S.scene.remove(s.m); s.m.material.dispose(); s.m.children[0].material.dispose(); S.eshots.splice(i, 1); }
  }
}

/* ===== explosions (firework launcher, bombers, boss slam) ===== */
const BLAST_LIGHTS = [];
function explosion(p, radius, dmgPlayer, dmgEnemy, firework, source) {
  S.shake = Math.max(S.shake, clamp(1 - p.distanceTo(S.player.pos) / 30, 0, 0.7));
  SND.explosion(p, radius / 5, firework);
  FX.burst(p, 60, 12, 0.5, 0.6, 0.1, COL.fire, 0, 4);
  SMOKE.burst(p, 18, 4, 1.4, 1.2, 3.5, [0.12, 0.1, 0.12], -0.6, 2);
  if (firework) { const cols = [pick(FIREWORK), pick(FIREWORK)]; FX.burst(_v.copy(p).setY(p.y + 0.5), 110, 16, 1.3, 0.3, 0.05, cols, 4, 1.6); }
  const L = BLAST_LIGHTS.find(l => l.userData.t <= 0) || BLAST_LIGHTS[0];
  if (L) { L.position.copy(p).setY(p.y + 1); L.color.setRGB(1, 0.6, 0.3); L.userData.t = 0.35; }
  if (dmgPlayer > 0) { const d = Math.hypot(p.x - S.player.pos.x, p.y - (S.player.pos.y - 0.8), p.z - S.player.pos.z); if (d < radius) S.player.damage(dmgPlayer * S.diff.dmg * (1 - d / radius * 0.6), p); }
  if (dmgEnemy > 0) {
    for (const e of S.enemies.slice()) { if (e === source || e.dead) continue; const d = e.spheres[0].c.distanceTo(p); if (d < radius + e.rad) { const k = 1 - clamp(d / (radius + e.rad), 0, 1) * 0.6; if (damageEnemy(e, dmgEnemy * k * (S.player ? S.player.dmgMul() : 1))) hitMarker(true); } }
    for (const pt of S.portals) if (pt.alive) { const d = pt.center.distanceTo(p); if (d < radius + 2) damagePortal(pt, dmgEnemy * 0.8); }
    if (S.boss && S.boss.alive) S.boss.splash(p, radius, dmgEnemy);
  }
}

/* ===== portals (Shadow Gates) ===== */
const PORTAL_DEF = [
  { x: -26, z: -52, street: 'Hàng Bạc', reward: 'rifle' },
  { x: 26, z: -26, street: 'Hàng Buồm', reward: 'launcher' },
  { x: -52, z: 26, street: 'Mã Mây', reward: 'tea' },
];
function makePortals() {
  const swirl = {
    uniforms: { uTime: { value: 0 }, uHit: { value: 0 } }, transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `varying vec2 vUv; uniform float uTime; uniform float uHit;
      void main(){ vec2 p = vUv*2.0-1.0; float r = length(p); if(r>1.0) discard; float a = atan(p.y,p.x);
        float s = sin(a*5.0 + r*14.0 - uTime*5.0)*0.5+0.5; float s2 = sin(a*3.0 - r*9.0 + uTime*3.0)*0.5+0.5;
        vec3 c = mix(vec3(0.5,0.05,0.9), vec3(1.6,0.3,1.2), s*s2); c *= smoothstep(1.0,0.55,r) * (0.8 + 0.6*s);
        c += vec3(2.0,1.4,2.5) * smoothstep(0.25,0.0,r); c += vec3(uHit*2.0);
        gl_FragColor = vec4(c*1.4, smoothstep(1.0,0.8,r)); }`
  };
  const ringM = new THREE.MeshStandardMaterial({ color: 0x1a0822, emissive: new THREE.Color(1.2, 0.2, 2.0), emissiveIntensity: 1, roughness: 0.4 });
  const beamM = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.8, 0.15, 1.4), transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const rockM = new THREE.MeshStandardMaterial({ color: 0x241a2a, roughness: 0.9, flatShading: true });
  PORTAL_DEF.forEach((d, i) => {
    const g = new THREE.Group(); g.position.set(d.x, 0, d.z); S.scene.add(g);
    const mat = new THREE.ShaderMaterial(swirl); mat.uniforms = { uTime: { value: 0 }, uHit: { value: 0 } };
    const disc = new THREE.Mesh(new THREE.CircleGeometry(2.1, 40), mat); disc.position.y = 2.7; g.add(disc);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.22, 10, 40), ringM); ring.position.y = 2.7; g.add(ring);
    for (let k = 0; k < 7; k++) { const a = k / 7 * TAU; const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.4, 0.8), 0), rockM); rk.position.set(Math.cos(a) * 2.6, rand(0.1, 0.4), Math.sin(a) * 2.6); rk.rotation.set(rand(0, 3), rand(0, 3), 0); rk.castShadow = true; g.add(rk); }
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 2.2, 60, 16, 1, true), beamM); beam.position.y = 30; g.add(beam);
    const light = new THREE.PointLight(0xb040ff, 30, 22, 1.6); light.position.y = 3; g.add(light);
    S.portals.push({ g, disc, ring, beam, light, mat, def: d, idx: i, center: new THREE.Vector3(d.x, 2.7, d.z), hp: 1, maxHp: 1, alive: true, spawnT: 2, hitT: 0 });
  });
}
function resetPortals() {
  S.portals.forEach(p => { p.maxHp = p.hp = 700 * S.diff.hp; p.alive = true; p.g.visible = true; p.light.intensity = 30; p.spawnT = 2; });
}
function damagePortal(p, dmg) {
  if (!p.alive) return; p.hp -= dmg; p.hitT = 0.12;
  if (Math.random() < 0.3) SND.portalHit(p.center);
  if (p.hp <= 0) {
    p.alive = false; p.g.visible = false; p.light.intensity = 0;
    SND.portalBreak(p.center); S.shake = Math.max(S.shake, 0.5);
    FX.burst(p.center, 160, 18, 1.4, 0.6, 0.05, [COL.purple, COL.pink, COL.white], 2, 1.5);
    SMOKE.burst(p.center, 30, 5, 2, 1.5, 4, COL.dark, -0.5, 1.5);
    addScore(1000, p.center);
    const rw = p.def.reward;
    if (rw === 'tea') { spawnPickup('tea', p.def.x + 1.5, p.def.z); spawnPickup('health', p.def.x - 1.5, p.def.z); }
    else spawnPickup('weapon:' + rw, p.def.x, p.def.z);
    spawnPickup('ammo', p.def.x, p.def.z + 2);
    onPortalDestroyed();
  }
}
function updatePortals(dt) {
  S.portals.forEach(p => {
    if (!p.alive) return;
    p.mat.uniforms.uTime.value = S.time; p.hitT = Math.max(0, p.hitT - dt); p.mat.uniforms.uHit.value = p.hitT * 4;
    p.ring.rotation.z += dt * 0.4; p.disc.lookAt(S.player.pos.x, 2.7, S.player.pos.z); p.ring.quaternion.copy(p.disc.quaternion);
    p.light.intensity = 26 + Math.sin(S.time * 4 + p.idx) * 6;
    if (Math.random() < 0.6) FX.emit(p.def.x + rand(-2, 2), 0.2, p.def.z + rand(-2, 2), 0, rand(1.5, 3.5), 0, 1.6, 0.3, 0.05, ...COL.purple);
  });
}

/* ===== pickups ===== */
function makePickupModel(type) {
  const g = new THREE.Group();
  if (type === 'ammo') {
    mk(MGEO.box, new THREE.MeshStandardMaterial({ color: 0x3f5f2a, roughness: 0.6 }), 0, 0, 0, 0.7, 0.4, 0.45, g);
    mk(MGEO.box, new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 1.8, 0.3) }), 0, 0, 0, 0.72, 0.08, 0.47, g);
  } else if (type === 'health') { // bánh mì
    const bread = new THREE.MeshStandardMaterial({ color: 0xd8a04a, roughness: 0.6, emissive: 0x3a2000 });
    const b = mk(new THREE.CapsuleGeometry(0.16, 0.55, 4, 10), bread, 0, 0, 0, 1, 1, 1, g); b.rotation.z = Math.PI / 2;
    for (let i = -1; i <= 1; i++) { const c = mk(MGEO.box, new THREE.MeshStandardMaterial({ color: 0xf0d39a }), i * 0.2, 0.15, 0, 0.12, 0.03, 0.08, g); c.rotation.y = 0.6; }
    mk(MGEO.box, new THREE.MeshStandardMaterial({ color: 0x4caf50 }), 0, 0.02, 0.12, 0.5, 0.06, 0.05, g);
  } else if (type === 'tea') { // trà sữa
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.5, 14), new THREE.MeshStandardMaterial({ color: 0xe7c99a, roughness: 0.3, emissive: 0x2a1a08, transparent: true, opacity: 0.95 })); g.add(cup);
    mk(new THREE.CylinderGeometry(0.21, 0.21, 0.04, 14), new THREE.MeshStandardMaterial({ color: 0xffffff }), 0, 0.26, 0, 1, 1, 1, g);
    mk(MGEO.cyl, new THREE.MeshStandardMaterial({ color: 0x2f6b2a }), 0.05, 0.42, 0, 0.025, 0.4, 0.025, g).rotation.z = 0.2;
    for (let i = 0; i < 8; i++) mk(MGEO.sph, new THREE.MeshStandardMaterial({ color: 0x1a0f08, roughness: 0.2 }), Math.cos(i) * 0.1, -0.18, Math.sin(i) * 0.1, 0.045, 0.045, 0.045, g);
    mk(MGEO.box, new THREE.MeshStandardMaterial({ color: 0x2f6b2a }), 0, 0.02, 0.19, 0.18, 0.12, 0.01, g);

  }
  const glowCol = type === 'tea' ? [0.6, 1.6, 0.6] : type === 'health' ? [1.6, 1.1, 0.4] : type === 'ammo' ? [1.4, 1.4, 0.4] : [1.6, 0.8, 2];
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: new THREE.Color(...glowCol), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.6 }));
  halo.scale.set(2, 2, 1); g.add(halo);

}
function spawnPickup(type, x, z) {
  const p = V3().set(x, 0, z); collide(p, 0.5);
  const m = makePickupModel(type); m.position.set(p.x, 0.7, p.z); S.scene.add(m);
  S.pickups.push({ type, pos: p, m, t: Math.random() * 6, life: type.startsWith('weapon') ? 1e9 : 45 });
}
function updatePickups(dt) {
  const P = S.player.pos;
  for (let i = S.pickups.length - 1; i >= 0; i--) {
    const k = S.pickups[i]; k.t += dt; k.life -= dt;
    k.m.position.y = 0.7 + Math.sin(k.t * 3) * 0.12; k.m.rotation.y += dt * 1.6;
    if (k.life < 5) k.m.visible = Math.floor(k.t * 8) % 2 === 0;
    if (Math.hypot(k.pos.x - P.x, k.pos.z - P.z) < 1.5 && S.player.collect(k.type)) { S.scene.remove(k.m); S.pickups.splice(i, 1); continue; }
    if (k.life <= 0) { S.scene.remove(k.m); S.pickups.splice(i, 1); }

/* ===== final boss: Thuồng Luồng, a serpent spirit ===== */
class Boss {
  constructor() {
    this.alive = true; this.hp = this.maxHp = 3200 * S.diff.hp * S.diff.bossHp; this.t = 0; this.state = 'intro'; this.stateT = 0;
    this.head = new THREE.Vector3(0, -6, 0); this.vel = V3(); this.ang = 0; this.atkT = 3; this.summonT = 12; this.rage = false; this.flash = 0; this.diveHit = false; this.dyingT = 0;
    this.g = new THREE.Group(); S.scene.add(this.g);
    const scale = new THREE.MeshStandardMaterial({ color: 0x5a3a7a, map: TEX.scales, roughness: 0.45, metalness: 0.2, emissive: new THREE.Color(0.25, 0.04, 0.35) });
    const belly = new THREE.MeshStandardMaterial({ color: 0xc9b27a, roughness: 0.6, emissive: 0x100800 });
    const spikeM = new THREE.MeshStandardMaterial({ color: 0x220a30, emissive: new THREE.Color(1.4, 0.2, 2.2), roughness: 0.4 });
    this.mats = [scale];
    // head
    const h = this.hg = new THREE.Group(); this.g.add(h);
    mk(MGEO.box, scale, 0, 0, 0.2, 1.5, 1.1, 2.1, h);
    mk(MGEO.box, scale, 0, -0.15, 1.45, 1.1, 0.6, 1.0, h);
    this.jaw = new THREE.Group(); this.jaw.position.set(0, -0.45, 0.7); h.add(this.jaw);
    mk(MGEO.box, belly, 0, -0.1, 0.6, 1.0, 0.3, 1.5, this.jaw);
    const teeth = new THREE.MeshStandardMaterial({ color: 0xf2ead0 });
    for (let i = 0; i < 5; i++) { mk(MGEO.cone, teeth, -0.35 + i * 0.175, -0.62, 1.75, 0.06, 0.25, 0.06, h).rotation.x = Math.PI; mk(MGEO.cone, teeth, -0.35 + i * 0.175, 0.1, 1.2, 0.05, 0.2, 0.05, this.jaw); }
    const hornM = new THREE.MeshStandardMaterial({ color: 0xd8c690, roughness: 0.4 });
    [-1, 1].forEach(s => {
      const hn = mk(MGEO.cone, hornM, s * 0.5, 0.75, -0.4, 0.16, 1.6, 0.16, h); hn.rotation.set(-1.0, 0, s * -0.35);
      const w = mk(MGEO.cyl, hornM, s * 0.85, -0.2, 1.6, 0.025, 1.8, 0.025, h); w.rotation.set(0.2, 0, s * 1.2);
      mk(MGEO.sph, eyeMat(3.2, 0.6, 2.6), s * 0.55, 0.3, 1.0, 0.16, 0.12, 0.12, h);
    });
    for (let i = 0; i < 6; i++) mk(MGEO.cone, spikeM, 0, 0.6, -0.6 + i * 0.25 - 0.6, 0.12, 0.6 - i * 0.05, 0.12, h).rotation.x = -0.6;
    this.eyeLight = new THREE.PointLight(0xff40d0, 0, 14, 1.5); h.add(this.eyeLight); this.eyeLight.position.set(0, 0, 2);
    // body segments
    this.segs = []; const N = 20;
    for (let i = 0; i < N; i++) {
      const r = lerp(1.25, 0.35, i / (N - 1));
      const sg = new THREE.Group(); this.g.add(sg);
      mk(MGEO.sph, scale, 0, 0, 0, r, r * 0.95, r * 1.15, sg);
      mk(MGEO.sph, belly, 0, -r * 0.35, 0, r * 0.8, r * 0.6, r * 1.05, sg);
      if (i % 2 === 0) mk(MGEO.cone, spikeM, 0, r * 0.95, 0, r * 0.22, r * 0.9, r * 0.22, sg).rotation.x = -0.5;
      if (i === 5 || i === 13) [-1, 1].forEach(s => { const leg = mk(MGEO.cone, hornM, s * r, -r * 0.6, 0, r * 0.2, r * 1.2, r * 0.2, sg); leg.rotation.z = s * 2.4; });
      this.segs.push({ g: sg, r, pos: V3().set(0, -8, 0) });
    }
    // trail of head positions (body follows it)
    this.trail = []; for (let i = 0; i < 160; i++) this.trail.push(new THREE.Vector3(0, -6 - i * 0.3, 0));
    this.spheres = [{ c: this.head, r: 1.5, mul: 2 }, ...this.segs.map(s => ({ c: s.pos, r: s.r * 1.05, mul: 1 }))];
    SND.growl('boss', V3()); S.shake = 0.8;
  }
  layoutBody() {
    const tr = this.trail; let seg = 0, need = 1.8, acc = 0;
    for (let i = tr.length - 1; i > 0 && seg < this.segs.length; i--) {
      const a = tr[i], b = tr[i - 1], d = a.distanceTo(b);
      while (acc + d >= need && seg < this.segs.length) {
        const t = (need - acc) / (d || 1); this.segs[seg].pos.copy(a).lerp(b, t); seg++;
        need += seg < this.segs.length ? (this.segs[seg - 1].r + this.segs[seg].r) * 0.72 : 0;
      }
      acc += d;
    }
    for (; seg < this.segs.length; seg++) this.segs[seg].pos.copy(tr[0]);
    for (let i = 0; i < this.segs.length; i++) {
      const s = this.segs[i]; s.g.position.copy(s.pos);
      const prev = i === 0 ? this.head : this.segs[i - 1].pos; s.g.lookAt(prev);
    }
  }
  pushTrail() { const last = this.trail[this.trail.length - 1]; if (last.distanceTo(this.head) > 0.25) { this.trail.push(this.head.clone()); if (this.trail.length > 260) this.trail.shift(); } }
  update(dt) {
    if (!this.alive) return;
    this.t += dt; this.stateT += dt; this.flash = Math.max(0, this.flash - dt * 6);
    for (const m of this.mats) m.emissive.setRGB(0.25 + this.flash * 1.5 + (this.rage ? 0.3 : 0), 0.04 + this.flash * 1.5, 0.35 + this.flash * 1.5);
    if (this.dyingT > 0) return this.updateDeath(dt);
    const P = S.player.pos; const spd = this.rage ? 1.35 : 1;
    let target = _v;
    if (this.state === 'intro') {
      target.set(0, 9, 0); this.head.y += dt * 4.5;
      if (this.head.y > 8) { this.state = 'roam'; this.stateT = 0; }
      this.head.x = Math.sin(this.t) * 2; this.head.z = Math.cos(this.t) * 2;
      if (Math.random() < 0.8) SMOKE.burst(_v2.set(rand(-3, 3), 0.3, rand(-3, 3)), 1, 3, 1.2, 1.2, 3, COL.dark, -1, 1);
      this.faceTo(P, dt);
    } else if (this.state === 'roam') {
      this.ang += dt * 0.55 * spd;
      target.set(Math.cos(this.ang) * 10, 7 + Math.sin(this.t * 1.3) * 2, Math.sin(this.ang * 2) * 7);
      this.steer(target, 9 * spd, dt); this.faceTo(P, dt);
      this.atkT -= dt; this.summonT -= dt;
      if (this.summonT <= 0) { this.summonT = this.rage ? 13 : 18; this.summon(); }
      if (this.atkT <= 0) {
        const r = Math.random();
        if (r < 0.32) { this.state = 'dive'; this.stateT = 0; this.diveHit = false; SND.growl('boss', this.head); }
        else if (r < 0.62 || !this.rage) { this.volley(this.rage ? 7 : 5); this.atkT = this.rage ? 1.6 : 2.4; }
        else { this.ring(); this.atkT = 2.0; }
      }
    } else if (this.state === 'dive') {
      if (this.stateT < 0.9) { // wind-up
        this.steer(target.set(this.head.x * 0.9, 11, this.head.z * 0.9), 6, dt); this.faceTo(P, dt);
        this.eyeLight.intensity = 30; this.diveTarget = V3().set(clamp(P.x, -14, 14), 0.9, clamp(P.z, -14, 14));
      } else {
        const d = _v2.copy(this.diveTarget).sub(this.head), l = d.length();
        if (l > 0.8) { d.multiplyScalar(1 / l); this.head.addScaledVector(d, Math.min(l, 28 * spd * dt)); this.faceDir(d, dt * 4); }
        if (!this.diveHit && this.head.distanceTo(_v3.set(P.x, P.y - 0.8, P.z)) < 2.6) { this.diveHit = true; S.player.damage(26 * S.diff.dmg, this.head); }
        if (l <= 0.8 || this.stateT > 2.4) {
          this.state = 'recover'; this.stateT = 0; this.eyeLight.intensity = 0;
          S.shake = Math.max(S.shake, 0.7); SND.boom();
          FX.burst(_v2.copy(this.head).setY(0.3), 70, 14, 0.7, 0.5, 0.05, [COL.purple, COL.pink], 0, 3, 1, 0);
          SMOKE.burst(_v2.copy(this.head).setY(0.3), 26, 7, 1.2, 1.2, 3, [0.15, 0.1, 0.18], -0.3, 2);
          const pd = Math.hypot(P.x - this.head.x, P.z - this.head.z);
          if (pd < 6.5 && P.y < 2.1) S.player.damage(18 * S.diff.dmg * (1 - pd / 9), this.head);
        }
      }
    } else if (this.state === 'recover') { // stunned near the ground: headshot window
      this.head.y = lerp(this.head.y, 1.6, dt * 3); this.faceTo(P, dt * 0.5);
      if (this.stateT > (this.rage ? 1.4 : 2.0)) { this.state = 'roam'; this.stateT = 0; this.atkT = 1.2; }
    }
    this.head.x = clamp(this.head.x, -14, 14); this.head.z = clamp(this.head.z, -14, 14);
    if (this.state !== 'intro') this.head.y = Math.max(1.4, this.head.y);
    this.hg.position.copy(this.head);
    this.jaw.rotation.x = 0.15 + Math.max(0, Math.sin(this.t * 3)) * 0.25 + (this.state === 'dive' ? 0.5 : 0);
    this.pushTrail(); this.layoutBody();
    if (Math.random() < 0.5) FX.emit(this.head.x + rand(-1, 1), this.head.y + rand(-0.5, 0.5), this.head.z + rand(-1, 1), 0, 1, 0, 0.8, 0.4, 0.05, ...COL.purple);

// one bullet: walls, ground, monsters, gates, boss
function hitscan(o, d, dmg, muzzleW, tracerChance) {
  let best = rayWall3(o, d, 140), kind = 'wall', target = null, mul = 1;
  if (d.y < -1e-4) { const tg = o.y / -d.y; if (tg < best) { best = tg; kind = 'ground'; } }
  for (const e of S.enemies) { if (e.dead) continue; for (const sp of e.spheres) { const t = raySphere(o, d, sp.c, sp.r); if (t > 0 && t < best) { best = t; kind = 'enemy'; target = e; mul = sp.mul; } } }
  for (const p of S.portals) { if (!p.alive) continue; const t = raySphere(o, d, p.center, 2.1); if (t > 0 && t < best) { best = t; kind = 'portal'; target = p; } }

  const pt = _v3.copy(o).addScaledVector(d, best);
  if (Math.random() < tracerChance) tracer(muzzleW, pt);
  const dm = dmg * S.player.dmgMul();
  if (kind === 'enemy') { S.hits++; const k = damageEnemy(target, dm, mul); hitMarker(k); FX.burst(pt, 6, 4, 0.25, 0.2, 0.03, target.type === 'wisp' ? COL.wisp : COL.purple, 4, 3); if (!k && target.vel) target.vel.addScaledVector(d, 1.2); }
  else if (kind === 'portal') { S.hits++; damagePortal(target, dm); hitMarker(false); FX.burst(pt, 6, 5, 0.3, 0.25, 0.03, COL.pink, 2, 3); }
  else if (kind === 'boss') { S.hits++; const k = S.boss.damage(dm, mul, pt); hitMarker(k || mul > 1); FX.burst(pt, 8, 5, 0.3, 0.3, 0.03, mul > 1 ? COL.white : COL.purple, 3, 3); }
  else if (best < 140) {
    FX.burst(pt, 5, 5, 0.25, 0.12, 0.02, COL.spark, 9, 2);
    SMOKE.emit(pt.x, pt.y, pt.z, rand(-0.3, 0.3), 0.6, rand(-0.3, 0.3), 0.8, 0.2, 0.9, 0.35, 0.33, 0.3, -0.2, 1, 0.6);
    if (Math.random() < 0.25) SND.impact(pt);
  }
}

/* ===== main loop ===== */

    director(dt);
    for (let i = S.enemies.length - 1; i >= 0; i--) if (S.enemies[i].update(dt)) { S.scene.remove(S.enemies[i].g); S.enemies.splice(i, 1); }

    moon.position.set(P.pos.x - 40, 70, P.pos.z - 60); moon.target.position.set(P.pos.x, 0, P.pos.z);
    updateHUD(dt);
    post.comp.uniforms.uDmg.value = Math.min(1, P.dmgFlash); post.comp.uniforms.uLow.value = P.hp < 35 ? (1 - P.hp / 35) : 0; post.comp.uniforms.uTea.value = P.tea > 0 ? Math.min(1, P.tea / 2) : 0;

    cam.position.set(Math.cos(t) * 24, 26 + Math.sin(t * 2) * 3, Math.sin(t) * 24); cam.lookAt(0, 2, 0);
    if (Math.abs(cam.fov - 70) > 0.1) { cam.fov = 70; cam.updateProjectionMatrix(); }
    S.time += dt; if (!S.player) S.player = { pos: cam.position }; updatePortals(dt);
    post.comp.uniforms.uDmg.value = 0; post.comp.uniforms.uLow.value = 0; post.comp.uniforms.uTea.value = 0;
    moon.position.set(-40, 70, -60); moon.target.position.set(0, 0, 0);
  }
  FX.update(dt); SMOKE.update(dt);
  for (const l of BLAST_LIGHTS) { if (l.userData.t > 0) { l.userData.t -= dt; l.intensity = 120 * Math.max(0, l.userData.t / 0.35); } else l.intensity = 0; }
  post.comp.uniforms.uTime.value = (now / 1000) % 100;
  if (!window.__noRender) post.render(S.scene, S.camera);
}

function boot() {
  initRenderer(); buildMinimapBase(); setupInput(); setupUI();
  addEventListener('resize', onResize); addEventListener('orientationchange', () => setTimeout(onResize, 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) pauseGame(); });
  requestAnimationFrame(frame);
  window.__game = { S, startGame, settings, tick, mouse, keys, inp, WEAPONS, endGame, render: () => { FX.update(0.016); SMOKE.update(0.016); post.render(S.scene, S.camera); }, spawnEnemy, Boss, applyQuality };
}
boot();

})();
</script>
